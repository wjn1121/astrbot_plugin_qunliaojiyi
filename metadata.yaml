name: astrbot_plugin_qunliaojiyi
display_name: 群聊记忆
short_desc: 低成本群聊长期记忆：增量积累群聊风格与人格档案，零网络注入，可选主动接话和按群限次搜索
desc: >-
  把群聊记录攒起来，攒够新消息就交给一次 LLM 做增量提炼：按「情境 → 表达」入库，
  措辞变了也能认出是同一条并合并，权重跨轮次累加，风格会随聊天越攒越厚，不再每轮重写。
  每条必须带本轮原文证据（对不上就丢）、新条目要过入库自检和两轮确认才生效，
  长期不用的按时效自动降级归档；群里风格变了，库会自己跟着变。
  回复时以临时内容注入，不改 system prompt、不写会话历史，LLM 前缀缓存仍能命中。
  场景化表达优先用触发词本地匹配，命中即不发起任何向量请求；向量请求带硬超时，
  超时自动降级，不会拖慢回复。
  自带左侧分栏面板：学习库按群聊与私聊分组、可批准否决钉住并展开证据原文，
  群号和 QQ 号可置顶；Token 消费页有当日 24 小时分布与近 7 天趋势；
  每个群可生成一份 markdown 人格档案，与按天账单一起放在插件自己的数据目录里，自动段随学习与审核更新、
  人工段随便改且永不被覆盖。手动添加的记忆单独存一个文件，自动学习不会覆盖。
  另有可选功能：风格强度分档与「可概率压过人格」（默认不触发）、主动插话（默认关闭，
  三重冷却与退避）、被动/主动分开的字数上限、联网搜索接管（按群独立限次，默认 DeepSeek
  搜索，¥0.005/次）、管理员在对话里调参、按天 token 消耗统计。
  仍保留 1.3.x 的整表重写模式，learn_mode 切成 replace 即可一键回退，数据双向兼容。
