name: astrbot_plugin_qunliaojiyi
display_name: 群聊记忆 · 人格养成
short_desc: 记住你们群怎么说话、每个人是谁，还会接梗发表情包：群体风格 + 人格档案 + 个人画像 + 好感关系 + 斗图
desc: >-
  它管三件事：这个群怎么说话，这个人在我这儿是谁，还有什么时候该甩张表情包。

  群风格靠增量学习：攒够新消息才交给一次 LLM 提炼，按「情境 → 表达」入库，措辞变了也能认出
  是同一条并合并，权重跨轮次累加，风格随聊天越攒越厚；每条必须带本轮原文证据（对不上就丢），
  长期不用的按时效自动降级归档。回复时以临时内容注入，不改 system prompt、不写会话历史，
  DeepSeek 前缀缓存仍能命中——这是本插件省 token 的根本。

  每个人靠三层记忆：关系（千分制好感、五档亲疏、自然衰减、越熟越难涨，
  装了「吃什么」插件还能靠投喂加成）、
  事实（按 QQ 号唯一，核心/深层/浅层三档按熟练度自动落位，遗忘天数可在面板调）、
  画像（把事实提炼成一段「他是谁」，字数按好感给，陌生 120 字到主人 800 字，可手改）。

  每一项会花钱的地方都有刻度：五档主动回复、按好感自动分档的注入配额、可单独设 0 的画像上限、
  可调的遗忘天数、与消息量脱钩的学习预算。面板上 92 项参数跟着功能分页，逐条标了 token 影响箭头。
  另有可选能力：主动插话（按群热度判断该不该开口，五档强度一键切换，默认关闭）、
  联网搜索接管（按群独立限次）、输出层去模型腔、管理员在对话里调参、按天 token 账单与每日花费上限。

  还能在群里接梗发图：表情包图库存在本地，挑图也在本地算，发图直接读文件、不经过模型。
  图可以从面板上传、从群消息里 /收图、或者把 bot 号的收藏表情一键同步进来；每张图能打标签，
  回复生成完先拿正文撞一遍全库标签，撞上就发那张，稀有标签权重更高。七档强度按效果递增，
  从纯关键词（零成本）到每轮让模型自己判断；给图打标用的是视觉模型，一张不到一分钱。
  发图有密度上限：一天不超过当天回复总数的三成，额度还按全天摊开，不会集中在某一小时刷屏。

  在玩「QQ 养鱼」的朋友常问的「它记不住人」，就是这个插件负责的那一层：不接管你的鱼、
  不改人设，只补上跨群跨私聊的记忆与关系。装上它，鱼还是那条鱼，但它开始认人了。

  自带分栏面板：概览 / 学习库 / 人格与关系 / 喂食 / 表情包 / 主动回复 / 人格档案 /
  会话与特征 / 注入预览 / Token 消费 / 联网搜索 / 参数。三个列表统一成 Excel 式列头筛选，
  条目可批准、否决、置顶、删除，所有按钮都带悬停注解。
