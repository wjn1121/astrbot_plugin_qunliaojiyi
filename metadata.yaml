# 学习、注入、关系、事实都走 AstrBot 的通用管线，没有平台专属逻辑。
# 只写 aiocqhttp 会让 Telegram / Discord / 飞书用户按平台筛选时永远搜不到。
# 非 QQ 平台的差别只有一处：识别「回复 bot」依赖被引用消息的发送者，取不到时
# 这条路径不生效，@ 和私聊照常。
support_platforms:
