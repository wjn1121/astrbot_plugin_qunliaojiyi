name: astrbot_plugin_qunliaojiyi
display_name: 群聊记忆
short_desc: 低成本群聊长期记忆：学习群聊风格并零网络注入，可选主动接话与按群限次的联网搜索
desc: >-
  把群聊记录攒起来，定时（默认 6 小时）交给一次 LLM 提炼成「稳定风格」和「场景化表达」，
  回复时以临时内容注入，不改 system prompt、不写会话历史，LLM 前缀缓存仍能命中。
  场景化表达优先用触发词本地匹配，命中即不发起任何向量请求；向量请求带硬超时，
  超时自动降级，不会拖慢回复。自带设置与调试面板，可查看每群学到的特征、手动学习、
  预览注入效果、热调参数，并展示累计成本。手动添加的记忆单独存一个文件，
  自动学习不会覆盖，可与学习产出分开管理和调整熟练度。
  1.3.0 起另有：风格强度分档与「可概率压过人格」（默认不触发）、主动插话（默认关闭，
  三重冷却与退避）、被动/主动分开的字数上限、联网搜索接管（含每群每日次数上限，
  默认用 DeepSeek 搜索，¥0.005/次）、管理员对话调参、按天 token 消耗统计与 7 天趋势。
