<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>群聊记忆</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div>
        <h1>🧠 群聊记忆</h1>
        <p class="sub" id="version">从群聊里学习说话风格，低频提炼、按语境注入</p>
      </div>
      <div class="top-actions">
        <button id="newSessionBtn" class="ghost">➕ 新建会话记忆</button>
        <button id="refresh" class="ghost">🔄 刷新</button>
        <button id="importBtn" class="ghost">📥 导入备份</button>
        <button id="exportBtn" class="ghost">📤 导出数据</button>
      </div>
    </header>

    <section class="card">
      <h2>运行状态</h2>
      <div id="stats" class="grid"></div>
      <p class="hint" id="schedule"></p>
    </section>

    <section class="card">
      <h2>累计成本 <small>统计的是本插件自己发起的请求量，不含正常聊天</small></h2>
      <div id="cost" class="grid"></div>
    </section>

    <section class="card">
      <h2 class="card-title">
        <span>⚙️ 运行参数 <small>（改动即时生效，不写回配置文件）</small></span>
        <button id="resetRuntime" class="ghost">恢复配置值</button>
      </h2>
      <div id="settings" class="settings"></div>
    </section>

    <section class="card">
      <h2 class="card-title">
        <span>🔍 注入预览</span>
        <small>选一个会话，输入一句话，看实际会注入什么</small>
      </h2>
      <div class="preview-bar">
        <select id="previewSession"></select>
        <input id="previewMessage" type="text" placeholder="输入一条群友可能说的话，例如：笑死我了 666" />
        <button id="previewBtn">预览</button>
      </div>
      <pre id="previewOut" class="preview-out empty">尚未预览</pre>
    </section>

    <section class="card">
      <h2 class="card-title">
        <span>📚 会话与特征</span>
        <span class="title-actions">
          <button id="clearLearned" class="ghost danger">清空学习产出</button>
          <button id="clearManual" class="ghost danger">清空手动记忆</button>
          <button id="clearAll" class="ghost danger">清空全部</button>
        </span>
      </h2>
      <div class="toolbar">
        <input id="search" type="search" placeholder="搜索会话名、群号或特征内容" />
        <select id="sort">
          <option value="traits">按特征数</option>
          <option value="recent">按最近学习</option>
          <option value="name">按名称</option>
        </select>
        <span id="pagerInfo" class="hint"></span>
        <button id="prevPage" class="ghost">上一页</button>
        <button id="nextPage" class="ghost">下一页</button>
      </div>
      <div id="sessions"></div>
    </section>
  </main>

  <div id="confirmModal" class="modal" hidden>
    <div class="modal-box">
      <p id="confirmText"></p>
      <div class="modal-actions">
        <button id="confirmCancel" class="ghost">取消</button>
        <button id="confirmOk" class="danger">确认</button>
      </div>
    </div>
  </div>

  <div id="editModal" class="modal" hidden>
    <div class="modal-box">
      <h3 id="editTitle">编辑特征</h3>
      <label class="field">内容
        <input id="editContent" type="text" />
      </label>
      <label class="field">类型
        <select id="editCategory">
          <option value="stable">稳定风格（跨场景通用）</option>
          <option value="situational">场景化表达（特定语境才用）</option>
        </select>
      </label>
      <label class="field">场景描述
        <input id="editContext" type="text" placeholder="场景化表达才有，可留空" />
      </label>
      <label class="field">触发词
        <input id="editTriggers" type="text" placeholder="逗号分隔，最多 3 个" />
      </label>
      <label class="field">熟练度 <b id="editProfValue" class="prof-value">60</b>
        <input id="editProficiency" type="range" min="0" max="100" step="1" value="60" />
      </label>
      <p class="hint" id="editHint"></p>
      <div class="modal-actions">
        <button id="editBatch" class="ghost">批量粘贴</button>
        <button id="editCancel" class="ghost">取消</button>
        <button id="editSave">保存</button>
      </div>
    </div>
  </div>

  <div id="batchModal" class="modal" hidden>
    <div class="modal-box wide">
      <h3>批量添加手动记忆</h3>
      <p class="hint">一行一条：<code>内容|场景|触发词1,触发词2</code>，后两段可以省略，类型统一用下面选的。</p>
      <label class="field">类型
        <select id="batchCategory">
          <option value="stable">稳定风格（跨场景通用）</option>
          <option value="situational">场景化表达（特定语境才用）</option>
        </select>
      </label>
      <label class="field">内容
        <textarea id="batchText" rows="9" placeholder="短句连发，一句一气泡&#10;爱用「绷不住了」|看到离谱内容时感叹|绷不住,离谱&#10;聊到游戏就开嘲讽"></textarea>
      </label>
      <p class="hint" id="batchHint"></p>
      <div class="modal-actions">
        <button id="batchCancel" class="ghost">取消</button>
        <button id="batchSave">添加</button>
      </div>
    </div>
  </div>

  <div id="newModal" class="modal" hidden>
    <div class="modal-box">
      <h3>新建会话记忆</h3>
      <p class="hint">给还没在本插件里出现过的会话加记忆。平台实例必须选对，填错会造出一个永远不生效的僵尸会话。</p>
      <label class="field">平台实例
        <select id="newPlatform"></select>
      </label>
      <label class="field">会话类型
        <select id="newKind">
          <option value="GroupMessage">群聊</option>
          <option value="FriendMessage">私聊</option>
        </select>
      </label>
      <label class="field">群号 / 用户号
        <input id="newTarget" type="text" placeholder="例如 1038882918" />
      </label>
      <p class="hint" id="newPreview">拼出的会话 ID：—</p>
      <div class="modal-actions">
        <button id="newCancel" class="ghost">取消</button>
        <button id="newNext">下一步：填内容</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="/api/plugin/page/bridge-sdk.js"></script>
  <script src="./app.js"></script>
</body>
</html>
