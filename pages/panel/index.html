<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>群聊记忆</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div>
        <h1>🧠 群聊记忆</h1>
        <p class="sub" id="version">从群聊里学习说话风格，低频提炼、按语境注入</p>
      </div>
      <div class="top-actions">
        <button id="refresh" class="ghost">🔄 刷新</button>
        <button id="importBtn" class="ghost">📥 导入备份</button>
        <button id="exportBtn" class="ghost">📤 导出数据</button>
      </div>
    </header>

    <section class="card">
      <h2>运行状态</h2>
      <div id="stats" class="grid"></div>
      <p class="hint" id="schedule"></p>
    </section>

    <section class="card">
      <h2>累计成本 <small>统计的是本插件自己发起的请求量，不含正常聊天</small></h2>
      <div id="cost" class="grid"></div>
    </section>

    <section class="card">
      <h2 class="card-title">
        <span>⚙️ 运行参数 <small>（改动即时生效，不写回配置文件）</small></span>
        <button id="resetRuntime" class="ghost">恢复配置值</button>
      </h2>
      <div id="settings" class="settings"></div>
    </section>

    <section class="card">
      <h2 class="card-title">
        <span>🔍 注入预览</span>
        <small>选一个会话，输入一句话，看实际会注入什么</small>
      </h2>
      <div class="preview-bar">
        <select id="previewSession"></select>
        <input id="previewMessage" type="text" placeholder="输入一条群友可能说的话，例如：笑死我了 666" />
        <button id="previewBtn">预览</button>
      </div>
      <pre id="previewOut" class="preview-out empty">尚未预览</pre>
    </section>

    <section class="card">
      <h2 class="card-title">
        <span>📚 会话与特征</span>
        <button id="clearAll" class="ghost danger">清空全部</button>
      </h2>
      <div class="toolbar">
        <input id="search" type="search" placeholder="搜索会话名、群号或特征内容" />
        <select id="sort">
          <option value="traits">按特征数</option>
          <option value="recent">按最近学习</option>
          <option value="name">按名称</option>
        </select>
        <span id="pagerInfo" class="hint"></span>
        <button id="prevPage" class="ghost">上一页</button>
        <button id="nextPage" class="ghost">下一页</button>
      </div>
      <div id="sessions"></div>
    </section>
  </main>

  <div id="confirmModal" class="modal" hidden>
    <div class="modal-box">
      <p id="confirmText"></p>
      <div class="modal-actions">
        <button id="confirmCancel" class="ghost">取消</button>
        <button id="confirmOk" class="danger">确认</button>
      </div>
    </div>
  </div>

  <div id="editModal" class="modal" hidden>
    <div class="modal-box">
      <h3>编辑特征</h3>
      <label class="field">内容
        <input id="editContent" type="text" />
      </label>
      <label class="field">场景描述
        <input id="editContext" type="text" placeholder="场景化表达才有，可留空" />
      </label>
      <label class="field">触发词
        <input id="editTriggers" type="text" placeholder="逗号分隔，最多 3 个" />
      </label>
      <div class="modal-actions">
        <button id="editCancel" class="ghost">取消</button>
        <button id="editSave">保存</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="/api/plugin/page/bridge-sdk.js"></script>
  <script src="./app.js"></script>
</body>
</html>
